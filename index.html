<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santer Hub — Agenda de eventos</title>
    <meta
      name="description"
      content="Agenda oficial do Santer Hub: eventos, treinamentos e imersões para os parceiros imobiliários da Santer."
    />
    <!-- A barra do navegador na mesma cor da superfície do site. -->
    <meta name="theme-color" content="#0a141d" />
    <!-- Símbolo da Santer sobre o azul da marca. O arquivo mora em public/. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Prévia do link em WhatsApp, LinkedIn, Facebook e X.

      A imagem é `public/og.png`, gerada por `ferramentas/gerar-og.sh`, e a URL
      dela é ABSOLUTA: robô de prévia não resolve caminho relativo, e um
      caminho relativo aqui daria uma prévia sem imagem. Como o endereço está
      escrito à mão, ele acompanha a subpasta /hub/ — é o mesmo cuidado da
      constante BASE_PUBLICA no `public/upload.php`, e muda junto com ela se o
      site trocar de endereço.

      A imagem tem fundo OPACO de propósito. Antes daqui havia um PNG
      transparente com as letras brancas do logo: os robôs de prévia achatam a
      transparência em branco, e o resultado era um retângulo quase vazio.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Santer Hub" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://santerempreendimentos.com.br/hub/" />
    <meta property="og:title" content="Santer Hub — Agenda de eventos" />
    <meta
      property="og:description"
      content="Capacitação. Conexão. Resultado. Confira a agenda do Santer Hub e garanta sua participação."
    />
    <meta property="og:image" content="https://santerempreendimentos.com.br/hub/og.png" />
    <meta property="og:image:type" content="image/png" />
    <!-- As dimensões declaradas deixam a prévia montar no tamanho certo já na
         primeira vez, antes de o robô terminar de baixar a imagem. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo do Santer Hub sobre fundo azul escuro, com a frase Capacitação. Conexão. Resultado."
    />

    <!-- Sem esta linha o X mostra uma tarja pequena em vez do cartão grande.
         O resto das informações ele lê das tags og: acima. -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fontes variáveis. A Inter entra com o eixo óptico (opsz 14..32): o
      desenho da letra muda com o tamanho, em vez de a mesma forma ser esticada
      do texto de apoio ao título.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <!--
      O tema é único e escuro, definido em `src/index.css`. Não há script de
      tema aqui: o fundo abaixo pinta a página já na cor certa, antes mesmo do
      CSS chegar, para não haver um lampejo branco enquanto o React monta.
    -->
    <style>
      html {
        background-color: #0a141d;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
